<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Student Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STUDENT PRODUCTIVITY</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="160" required>
      <button type="submit">Add task</button>
    </form>

    <section class="toolbar" aria-label="Task filters">
      <div id="task-summary" aria-live="polite">0 tasks</div>
      <div class="filters">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="active">Active</button>
        <button class="filter" type="button" data-filter="completed">Completed</button>
      </div>
    </section>

    <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add your first task above!</p>
    <footer>
      <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      <span>Tasks are saved in this browser.</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
